name: Auto Deploy to VPS Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Eksekusi Remote SSH ke VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          cd /root/modul4-compose
          git pull origin main
          docker build -t
          docker compose up -d --build
          docker image prune -f 
